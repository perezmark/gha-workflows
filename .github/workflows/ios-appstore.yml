name: iOS App Store Connect

on:
  workflow_call:
    inputs:
      scheme:
        required: true
        type: string
      project_path:
        required: true
        type: string
      bundle_id:
        required: true
        type: string
      team_id:
        required: true
        type: string
      provisioning_profile_name:
        required: true
        type: string
      xcode_version:
        default: '26.3'
        type: string
      override_build_number:
        default: ''
        type: string
      build_settings:
        default: ''
        type: string
      ref:
        default: ''
        description: 'Git ref (branch/tag/sha) to checkout. Defaults to the triggering ref.'
        type: string
    secrets:
      DISTRIBUTION_CERTIFICATE_P12_BASE64:
        required: true
      DISTRIBUTION_CERTIFICATE_PASSWORD:
        required: true
      PROVISIONING_PROFILE_BASE64:
        required: true
      APP_STORE_CONNECT_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64:
        required: true

permissions:
  contents: read

jobs:
  archive-and-upload:
    name: Archive & Upload
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode
        run: |
          XCODE_PATH="/Applications/Xcode_${{ inputs.xcode_version }}.app"
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install signing credentials
        env:
          P12_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | grep -A1 UUID | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm-cache
          key: spm-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/spm-cache"

      - name: Archive
        run: |
          VERSION_FLAGS=""
          if [ -n "${{ inputs.override_build_number }}" ]; then
            VERSION_FLAGS="CURRENT_PROJECT_VERSION=${{ inputs.override_build_number }}"
          fi

          xcodebuild archive \
            -project "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache" \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="${{ inputs.team_id }}" \
            ${{ inputs.build_settings }} \
            $VERSION_FLAGS

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ inputs.team_id }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ inputs.bundle_id }}</key>
              <string>${{ inputs.provisioning_profile_name }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision"
          rm -rf ~/.appstoreconnect/private_keys
